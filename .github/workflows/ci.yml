name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  ci:
    name: Lint, test and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '26'

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: true

      - name: Lint and check formatting
        run: pnpm check-lint

      - name: Typecheck
        run: pnpm check-types

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm build
