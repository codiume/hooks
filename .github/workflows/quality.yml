name: Code quality

on:
  pull_request:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "26"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.18.0
          run_install: true

      - name: Run Biome
        run: pnpm exec biome ci src
