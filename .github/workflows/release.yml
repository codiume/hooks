name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '26'

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: true

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v2.1.2
        with:
          version-script: pnpm run changeset:version
          publish-script: pnpm run changeset:publish
        # npm auth uses trusted publishing (OIDC via `id-token: write`), not a
        # token secret. Provenance is attached automatically.
        env:
          GITHUB_TOKEN: ${{ github.token }}
